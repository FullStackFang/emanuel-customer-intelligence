[package]
name = "emanuel-customer-intelligence"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emanuel_customer_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# The vendored OpenSSL static lib (SQLCipher's crypto backend) floods the MSVC link step
# with hundreds of harmless LNK4099 "PDB 'ossl_static.pdb' not found" notes. They are debug
# symbols for a prebuilt C library we never debug; silence the lint that surfaces linker
# stdout so real warnings are not buried. Does not affect the produced binary.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
reqwest = { version = "0.13", features = ["json", "form"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
hex = "0.4"
url = "2"
tiny_http = "0.12"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
smartcore = "=0.5.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
tempfile = "3"

# `npm run tauri dev` runs the dev profile, which was fully unoptimized: the Insights
# rebuild/analysis phases ran several times slower than in release. Optimize dependencies
# (SQLCipher decrypt, smartcore fits, serde) fully and this crate lightly so the dev app
# behaves like the shipped one without giving up fast incremental builds. Measured with
# `cargo run --release --example time_insights` (see openspec optimize-insights-load).
[profile.dev]
opt-level = 1
# Incremental compilation is DISABLED on purpose. Optimized incremental builds
# (opt-level > 0 + incremental) periodically corrupt rustc's codegen-unit cache on
# Windows/MSVC, producing `unresolved external symbol anon.*.llvm.*` LNK2001 errors
# that only `cargo clean -p ...` clears. Turning incremental off eliminates that stale
# cache entirely. Cost is small: only THIS crate does a full recompile per edit; the
# heavy deps below (sqlcipher, smartcore, serde) stay cached at opt-level 3.
incremental = false

[profile.dev.package."*"]
opt-level = 3
