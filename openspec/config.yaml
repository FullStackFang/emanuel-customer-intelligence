schema: spec-driven

context: |
  Desktop customer-intelligence app for Temple Emanu-El.
  Stack: Tauri v2, Rust, React 19, TypeScript, Vite, SQLCipher SQLite.
  Salesforce access is read-only; analytics use only the encrypted local mirror.
  The webview is untrusted and accesses data only through fixed Rust commands.
  Household names and exports require existing audit and privacy boundaries.
  Canonical membership terminology is defined in CONTEXT.md.
  Follow the repository's existing design system and test patterns.

rules:
  proposal:
    - State user impact and identify every new or modified capability.
    - Identify privacy, audit, source-data, and dependency impact when applicable.
  design:
    - Record alternatives and explain why the selected architecture fits the existing codebase.
    - Define failure behavior, migration, rollback, and data freshness semantics.
    - Do not leave product or data-definition decisions unresolved before implementation.
  specs:
    - Use canonical terms from CONTEXT.md.
    - Make privacy, audit, unavailable-source, and failure behavior testable when applicable.
    - Include scenarios for the motivating regression or failure case.
  tasks:
    - Order tasks by dependency and include explicit tests before implementation tasks.
    - End with full automated, real-data aggregate, and UI verification where applicable.
